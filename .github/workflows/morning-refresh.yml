name: Morning data refresh check

on:
  schedule:
    # 08:15 Asia/Taipei = 00:15 UTC
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON data
        run: python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('data/listings.json'), Path('data/source-status.json')]:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK: {path}')
          PY

      - name: Write daily refresh timestamp
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('data/source-status.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['lastScheduledCheck'] = datetime.now(timezone.utc).isoformat()
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit refresh status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: morning source refresh check'
          git push
