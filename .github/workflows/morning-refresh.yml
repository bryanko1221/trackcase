name: Batch listing scan

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/batch-sources.json'
      - '.github/workflows/morning-refresh.yml'
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch-listing-scan-main
  cancel-in-progress: false

jobs:
  batch-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Batch scan public listing indexes
        run: python scripts/batch_sync.py

      - name: Reconcile known direct listing pages
        run: python scripts/reconcile_listings.py

      - name: Apply manually verified listing corrections
        run: python scripts/apply_verified_overrides.py

      - name: Inject community catalog into website
        run: python scripts/inject_community_catalog.py

      - name: Validate data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('data/listings.json'), Path('data/source-status.json'), Path('data/batch-sources.json'), Path('data/batch-scan-report.json'), Path('data/verified-overrides.json'), Path('data/community-seed.json')]:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK: {path}')
          html = Path('index.html').read_text(encoding='utf-8')
          assert '<!-- COMMUNITY_CATALOG_V1 -->' in html
          print('OK: index.html community catalog')
          PY

      - name: Write Taiwan update timestamp
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          p = Path('data/source-status.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          now = datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=8)))
          data['lastUpdated'] = now.strftime('%Y-%m-%d %H:%M')
          data['lastScheduledCheck'] = now.isoformat()
          data['batchScanReport'] = 'data/batch-scan-report.json'
          data['automation'] = {'enabled': True, 'interval': 'every 3 hours', 'timezone': 'Asia/Taipei'}
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit scan data and timestamp
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/listings.json data/batch-scan-report.json data/source-status.json index.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: automatic listing validation and refresh'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git merge --no-edit -X ours origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git merge --abort || true
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep 5
          done
          echo 'Unable to push after 5 attempts.'
          exit 1
