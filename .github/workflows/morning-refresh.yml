name: Batch listing scan

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/batch-sources.json'
      - '.github/workflows/morning-refresh.yml'
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch-listing-scan-main
  cancel-in-progress: false

jobs:
  batch-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover full listing base
        run: python scripts/recover_base_listings.py

      - name: Batch scan indexes, pagination and every discovered direct listing
        run: python scripts/batch_sync.py

      - name: Reconcile known direct listing pages
        run: python scripts/reconcile_listings.py

      - name: Apply manually verified listing corrections
        run: python scripts/apply_verified_overrides.py

      - name: Inject community catalog into website
        run: python scripts/inject_community_catalog.py

      - name: Validate data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('data/listings.json'), Path('data/source-status.json'), Path('data/batch-sources.json'), Path('data/batch-scan-report.json'), Path('data/verified-overrides.json'), Path('data/community-seed.json'), Path('data/scan-ledger.json')]:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK: {path}')
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'id="communityCatalog"' in html
          print('OK: index.html community catalog')
          PY

      - name: Run strict 100 percent completeness gate
        run: python scripts/completeness_gate.py

      - name: Write Taiwan update timestamp
        run: |
          python - <<'PY'
          import json, re
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          p=Path('data/source-status.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          now=datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=8)))
          stamp=now.strftime('%Y-%m-%d %H:%M')
          data['lastUpdated']=stamp
          data['lastScheduledCheck']=now.isoformat()
          data['batchScanReport']='data/batch-scan-report.json'
          data['automation']={'enabled':True,'interval':'daily 09:00','timezone':'Asia/Taipei'}
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          # Keep every asset URL versioned so GitHub Pages/Safari cannot keep an old JS/CSS artifact.
          html=Path('index.html').read_text(encoding='utf-8')
          marker='id="lastUpdated">'
          if marker in html:
              start=html.index(marker)+len(marker); end=html.index('</span>',start)
              html=html[:start]+stamp+html[end:]
          v=now.strftime('%Y%m%d-%H%M%S')
          html=re.sub(r'(timestamp\.js)\?v=[^"\']+',r'\1?v='+v,html)
          html=re.sub(r'(app\.js)\?v=[^"\']+',r'\1?v='+v,html)
          html=re.sub(r'(dedupe-ui\.js)\?v=[^"\']+',r'\1?v='+v,html)
          html=re.sub(r'(style\.css)\?v=[^"\']+',r'\1?v='+v,html)
          Path('index.html').write_text(html,encoding='utf-8')
          print('Taiwan update timestamp:',stamp)
          print('Completeness:',data.get('scanCompleteness',{}).get('label'))
          PY

      - name: Commit scan data and website status
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/listings.json data/batch-scan-report.json data/source-status.json index.html timestamp.js
          git diff --cached --quiet && exit 0
          git commit -m 'chore: strict daily listing scan and website status'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git merge --no-edit -X ours origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git merge --abort || true
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep 5
          done
          echo 'Unable to push after 5 attempts.'
          exit 1
