<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>板橋房產監控中心</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><div class="eyebrow">BANQIAO PROPERTY INTELLIGENCE</div><h1>板橋房產監控中心</h1><p>特定大樓在售案件 × 每日變化 × 開發案件</p></div><div class="updated">資料庫狀態<br><span id="lastUpdated">讀取中…</span></div></header><main class="container"><nav class="tabs"><button class="tab active" data-view="listings">① 全部案件</button><button class="tab" data-view="changes">② 每日市場變化</button><button class="tab" data-view="develop">③ 開發案件</button></nav><section id="view-listings" class="view active"><div class="hero-card"><div><span class="tag">核心搜尋</span><h2>全部案件</h2><p>同一戶跨平台合併，售出案件保留至實價登錄。</p></div><div class="stats"><div><strong id="statTotal">0</strong><span>目前在售</span></div><div><strong id="statNew">0</strong><span>今日新增</span></div><div><strong id="statDrops">0</strong><span>今日降價</span></div><div><strong id="statSold">0</strong><span>售出待實登</span></div></div></div><div class="filters card"><div class="filter search"><label>關鍵字</label><input id="keyword" placeholder="社區、棟別、格局、戶別…"></div><div class="filter"><label>社區</label><select id="buildingFilter"></select></div><div class="filter"><label>棟別／區</label><select id="blockFilter"></select></div><div class="filter"><label>案件狀態</label><select id="statusFilter"><option value="all">全部</option><option value="active">🟢 在售</option><option value="price_drop">💰 降價</option><option value="gone_pending">⚠️ 下架待確認</option><option value="sold_pending">🔴 已售・待實登</option><option value="registered">✅ 已完成實登</option></select></div><div class="filter"><label>價格</label><select id="priceFilter"><option value="all">全部</option><option value="0-1500">1,500萬以下</option><option value="1500-2000">1,500～2,000萬</option><option value="2000-3000">2,000～3,000萬</option><option value="3000-99999">3,000萬以上</option></select></div><div class="filter"><label>坪數</label><select id="areaFilter"><option value="all">全部</option><option value="0-15">15坪以下</option><option value="15-25">15～25坪</option><option value="25-40">25～40坪</option><option value="40-999">40坪以上</option></select></div><div class="filter"><label>格局</label><select id="layoutFilter"><option value="all">全部</option><option>1房</option><option>2房</option><option>3房</option><option>4房</option></select></div><div class="filter"><label>車位</label><select id="parkingFilter"><option value="all">全部</option><option value="yes">有車位</option><option value="no">無車位</option></select></div><div class="filter"><label>排序</label><select id="sortFilter"><option value="floorDesc">棟別／樓層高→低</option><option value="priceAsc">價格低→高</option><option value="priceDesc">價格高→低</option><option value="unitAsc">單價低→高</option><option value="unitDesc">單價高→低</option><option value="updatedDesc">最近更新</option></select></div><button class="reset" id="resetFilters">清除條件</button></div><div class="list-head"><div id="resultCount">0 筆</div><div class="legend">🔵 同案平台　🆕 新增　🔴 待實登</div></div><div id="listingGrid" class="listing-grid"></div></section><section id="view-changes" class="view"><div class="page-title"><span class="tag">每日比對</span><h2>每日市場變化</h2><p>下架不直接刪除；確認售出後保留到實價登錄。</p></div><div class="change-grid"><article class="change-panel"><h3>🆕 今日新增 <span id="changeNewCount">0</span></h3><div id="newChanges"></div></article><article class="change-panel"><h3>💰 今日降價 <span id="changeDropCount">0</span></h3><div id="dropChanges"></div></article><article class="change-panel"><h3>🔴 已售・待實登 <span id="changeGoneCount">0</span></h3><div id="goneChanges"></div></article></div><div class="card history-card"><h3>案件狀態歷史</h3><div id="historyTable"></div></div></section><section id="view-develop" class="view"><div class="page-title"><span class="tag hot">房仲開發</span><h2>開發案件</h2><p>只把「已確認永慶無刊登」的在售案件列為可開發。</p></div><div class="develop-summary"><div class="summary-box hot"><strong id="developTotal">0</strong><span>可開發案件</span></div><div class="summary-box"><strong id="ownerCount">0</strong><span>疑似屋主自售</span></div><div class="summary-box"><strong id="noYQCount">0</strong><span>永慶未刊登</span></div></div><div class="card"><div class="develop-tools"><label>開發篩選 <select id="developFilter"><option value="all">全部可開發</option><option value="owner">屋主自售優先</option><option value="competitor">競業案件</option></select></label></div><div id="developGrid" class="listing-grid"></div></div></section></main><dialog id="detailDialog"><div class="dialog-inner"><button class="dialog-close" id="dialogClose">×</button><div id="detailContent"></div></div></dialog><script>(function(){const nativeFetch=window.fetch;window.fetch=async function(input,init){const response=await nativeFetch(input,init);const url=String(input);if(url.includes('data/listings.json')){try{const data=await response.clone().json();const fixed=data.filter(x=>!(x.community==='板橋新巨蛋'&&x.price===1200)).map(x=>{if(x.community==='板橋新巨蛋'&&x.price===1315){return {...x,price:1290,unit:105.56,area:12.41,layout:'1房1廳1衛',floor:32,totalFloor:40,parking:false,owner:true,status:'price_drop',updated:'2026-09-02',sourceVerified:'2026-09-02重新核實：原1315萬資料修正為1,290萬；32/40F、12.41坪、屋主李先生',sources:{...(x.sources||{}),好房網:true},links:{...(x.links||{}),好房網:'https://buy.housefun.com.tw/region/%E6%96%B0%E5%8C%97%E5%B8%82-%E6%9D%BF%E6%A9%8B%E5%8D%80_c/%E9%99%8D%E5%83%B9_tag/-1879_price/?od=UnitPriceDown'}}}return x});return new Response(JSON.stringify(fixed),{headers:{'Content-Type':'application/json'}})}catch(e){return response}}return response}})})();</script><script src="app.js"></script></body></html>
