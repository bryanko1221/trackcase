<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>板橋房產監控中心</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><div class="eyebrow">BANQIAO PROPERTY INTELLIGENCE</div><h1>板橋房產監控中心</h1><p>特定大樓在售案件 × 每日變化 × 開發案件</p></div><div class="updated">資料庫狀態<br><span id="lastUpdated">讀取中…</span></div></header><main class="container"><nav class="tabs"><button class="tab active" data-view="listings">① 全部案件</button><button class="tab" data-view="changes">② 每日市場變化</button><button class="tab" data-view="develop">③ 開發案件</button></nav><section id="view-listings" class="view active"><div class="hero-card"><div><span class="tag">核心搜尋</span><h2>全部案件</h2><p>同一戶跨平台合併；不同案件不強制合併。</p></div><div class="stats"><div><strong id="statTotal">0</strong><span>目前在售</span></div><div><strong id="statNew">0</strong><span>今日新增</span></div><div><strong id="statDrops">0</strong><span>今日降價</span></div><div><strong id="statSold">0</strong><span>狀態變更</span></div></div></div><div class="filters card"><div class="filter search"><label>關鍵字</label><input id="keyword" placeholder="社區、棟別、格局、戶別…"></div><div class="filter"><label>社區</label><select id="buildingFilter"><option value="all">全部</option></select></div><div class="filter"><label>棟別／區</label><select id="blockFilter"><option value="all">全部</option></select></div><div class="filter"><label>案件狀態</label><select id="statusFilter"><option value="all">全部</option><option value="active">🟢 在售</option><option value="price_drop">🔻 降價</option><option value="gone_pending">⚠️ 下架待確認</option><option value="sold_pending">⚠️ 消失／下架／狀態變更</option></select></div><div class="filter"><label>價格</label><select id="priceFilter"><option value="all">全部</option><option value="0-1500">1,500萬以下</option><option value="1500-2000">1,500～2,000萬</option><option value="2000-3000">2,000～3,000萬</option><option value="3000-99999">3,000萬以上</option></select></div><div class="filter"><label>坪數</label><select id="areaFilter"><option value="all">全部</option><option value="0-15">15坪以下</option><option value="15-25">15～25坪</option><option value="25-40">25～40坪</option><option value="40-999">40坪以上</option></select></div><div class="filter"><label>格局</label><select id="layoutFilter"><option value="all">全部</option><option>1房</option><option>2房</option><option>3房</option><option>4房</option></select></div><div class="filter"><label>車位</label><select id="parkingFilter"><option value="all">全部</option><option value="yes">有車位</option><option value="no">無車位</option></select></div><div class="filter"><label>排序</label><select id="sortFilter"><option value="floorDesc">棟別／樓層高→低</option><option value="priceAsc">價格低→高</option><option value="priceDesc">價格高→低</option><option value="updatedDesc">最近更新</option></select></div><button class="reset" id="resetFilters">清除條件</button></div><div class="list-head"><div id="resultCount">0 筆</div></div><div id="listingGrid" class="listing-grid"><div class="card">資料載入中…</div></div></section><section id="view-changes" class="view"><div class="page-title"><span class="tag">每日比對</span><h2>每日市場變化</h2></div><div class="change-grid"><article class="change-panel"><h3>🆕 今日新增 <span id="changeNewCount">0</span></h3><div id="newChanges"></div></article><article class="change-panel"><h3>🔻 價格變動 <span id="changeDropCount">0</span></h3><div id="dropChanges"></div></article><article class="change-panel"><h3>⚠️ 消失／下架／狀態變更 <span id="changeGoneCount">0</span></h3><div id="goneChanges"></div></article></div></section><section id="view-develop" class="view"><div class="page-title"><span class="tag hot">房仲開發</span><h2>開發案件</h2><p>只列已確認永慶未刊登的在售案件。</p></div><div class="develop-summary"><div class="summary-box hot"><strong id="developTotal">0</strong><span>可開發案件</span></div><div class="summary-box"><strong id="ownerCount">0</strong><span>疑似屋主自售</span></div><div class="summary-box"><strong id="noYQCount">0</strong><span>永慶未刊登</span></div></div><div class="card"><div class="develop-tools"><label>開發篩選 <select id="developFilter"><option value="all">全部可開發</option><option value="owner">屋主自售優先</option><option value="competitor">競業案件</option></select></label></div><div id="developGrid" class="listing-grid"></div></div></section></main><dialog id="detailDialog"><div class="dialog-inner"><button class="dialog-close" id="dialogClose">×</button><div id="detailContent"></div></div></dialog><script>
(function(){
var listings=[],meta={};var SOURCES=['591','信義','樂居','樂屋','中信','永慶','住商','台灣房屋','好房網'];
function $(s){return document.querySelector(s)}function all(s){return Array.from(document.querySelectorAll(s))}function st(x){return x.status||'active'}function money(n){return n==null?'—':Number(n).toLocaleString('zh-TW')+'萬'}
function community(v){if(!v)return '';var s=String(v).replace(/\s+/g,'');return s.indexOf('公園世紀')>=0?'板橋公園世紀':s}
function layout(v){var m=String(v||'').match(/(\d+)房/);return m?m[1]+'房':String(v||'')}
function sameBlock(a,b){a=String(a||'').replace(/\s/g,'');b=String(b||'').replace(/\s/g,'');if(a===b)return true;if((a==='B/C區'||a==='B、C區')&&(b==='B區'||b==='C區'))return true;if((b==='B/C區'||b==='B、C區')&&(a==='B區'||a==='C區'))return true;return false}
function active(x){return ['active','price_drop','price_up'].indexOf(st(x))>=0}
function merge(a,b){var m=Object.assign({},a,b);m.sources=Object.assign({},a.sources||{},b.sources||{});m.links=Object.assign({},a.links||{},b.links||{});if(a.area!=null&&b.area!=null&&a.area!==b.area){m.area=Math.max(a.area,b.area);m.areaNote=a.area+' / '+b.area+'坪（平台顯示差異）'}return m}
function dedupe(arr){var out=[];arr.forEach(function(x){if(!active(x)){out.push(x);return}var hit=-1;for(var i=0;i<out.length;i++){var y=out[i];if(!active(y))continue;if(community(x.community)!==community(y.community)||!sameBlock(x.block,y.block)||x.floor!==y.floor||x.parking!==y.parking||layout(x.layout)!==layout(y.layout))continue;if(x.area!=null&&y.area!=null&&Math.abs(x.area-y.area)>1)continue;var strong=(x.groupId&&y.groupId&&x.groupId===y.groupId);if(!strong&&x.price!==y.price)continue;hit=i;break}if(hit>=0)out[hit]=merge(out[hit],x);else out.push(x)});return out}
function valid(p,u){if(!u)return false;try{var s=new URL(u).hostname+new URL(u).pathname;if(p==='591')return /sale\.591\.com\.tw\/home\/house\/detail\//.test(s);if(p==='信義')return /sinyi\.com\.tw\/buy\/house\//.test(s);if(p==='樂屋')return /rakuya\.com\.tw\/.*\/sell\/info/.test(s);if(p==='永慶')return /yungching\.com\.tw\/house\//.test(s);if(p==='好房網')return /housefun\.com\.tw\/.*(?:house|buy)/i.test(s);return true}catch(e){return false}}
function links(x){var o=x.links||{},a=[];Object.keys(o).forEach(function(p){if(valid(p,o[p]))a.push('<a href="'+o[p]+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+p+'</a>')});return a.join('')}
function rank(b){return ({'A區':1,'B區':2,'B/C區':2,'B、C區':2,'C區':3,'D區':4})[b]||9}
function filtered(){var k=$('#keyword').value.trim().toLowerCase(),b=$('#buildingFilter').value,bl=$('#blockFilter').value,stt=$('#statusFilter').value,p=$('#priceFilter').value,a=$('#areaFilter').value,l=$('#layoutFilter').value,pk=$('#parkingFilter').value;return listings.filter(function(x){var ok=!k||[x.community,x.block,x.layout,x.id,x.address].join(' ').toLowerCase().indexOf(k)>=0;ok=ok&&(b==='all'||community(x.community)===b)&&(bl==='all'||x.block===bl)&&(stt==='all'||st(x)===stt);if(p!=='all')ok=ok&&x.price!=null&&x.price>=+p.split('-')[0]&&x.price<=+p.split('-')[1];if(a!=='all')ok=ok&&x.area!=null&&x.area>=+a.split('-')[0]&&x.area<=+a.split('-')[1];if(l!=='all')ok=ok&&String(x.layout||'').indexOf(l)===0;if(pk!=='all')ok=ok&&(pk==='yes'?x.parking:!x.parking);return ok})}
function sorted(a){var s=$('#sortFilter').value;return a.slice().sort(function(x,y){if(s==='priceAsc')return(x.price||0)-(y.price||0);if(s==='priceDesc')return(y.price||0)-(x.price||0);if(s==='updatedDesc')return String(y.updated||'').localeCompare(String(x.updated||''));return(rank(x.block)-rank(y.block))||((y.floor||-1)-(x.floor||-1))})}
function card(x){return '<article class="listing-card" data-id="'+x.id+'"><div class="listing-top"><div><div class="listing-title">'+(x.community||'')+'｜'+(x.block||'棟別待確認')+' '+(x.floor!=null?x.floor+'F':'樓層待確認')+'</div><div class="listing-sub">'+(x.area==null?'—':x.area)+'坪 · '+(x.layout||'—')+' · '+(x.parking?'有車位':'無車位')+'</div></div><div>'+(x.new?'<span class="new">🆕 新增</span>':'')+'<span class="status-badge">'+(st(x)==='price_drop'?'🔻 降價':st(x)==='sold_pending'?'⚠️ 狀態變更':st(x)==='gone_pending'?'⚠️ 下架待確認':'🟢 在售')+'</span></div></div><div class="price">'+money(x.price)+' <span class="unit">'+(x.unit?x.unit+'萬/坪':'單價待核實')+'</span></div><div class="facts"><div>樓層<b>'+(x.floor!=null?x.floor+'/'+(x.totalFloor||'-')+'F':'待確認')+'</b></div><div>坪數<b>'+(x.area==null?'—':x.area)+'坪</b></div><div>同案平台<b>'+SOURCES.filter(function(p){return x.sources&&x.sources[p]}).length+' 個</b></div></div><div class="platforms">'+SOURCES.map(function(p){return '<span class="platform '+(x.sources&&x.sources[p]?'':'off')+'">'+p+' '+(x.sources&&x.sources[p]?'●':'○')+'</span>'}).join('')+'</div><div class="source-direct">🔗 原始案件：'+(links(x)||'<span class="source-missing">尚未取得有效案件直連</span>')+'</div></article>'}
function render(){var d=sorted(filtered());$('#resultCount').textContent=d.length+' 筆案件';$('#listingGrid').innerHTML=d.map(card).join('')||'<div class="card">沒有符合條件的案件。</div>';all('.listing-card').forEach(function(e){e.onclick=function(){var x=listings.find(function(q){return q.id===e.dataset.id});if(!x)return;$('#detailContent').innerHTML='<div class="detail"><h2>'+x.community+'｜'+(x.block||'')+' '+(x.floor||'')+'F</h2><p>總價：'+money(x.price)+'<br>坪數：'+(x.area||'—')+'坪<br>格局：'+(x.layout||'—')+'<br>同案平台：'+SOURCES.filter(function(p){return x.sources&&x.sources[p]}).join('、')+'</p><h3>所有原始案件連結</h3><div class="source-links">'+(links(x)||'尚未取得有效案件直連')+'</div></div>';$('#detailDialog').showModal()}});$('#statTotal').textContent=listings.filter(active).length;$('#statNew').textContent=listings.filter(function(x){return x.new}).length;$('#statDrops').textContent=listings.filter(function(x){return st(x)==='price_drop'}).length;$('#statSold').textContent=listings.filter(function(x){return st(x)==='sold_pending'||st(x)==='gone_pending'}).length}
function fill(id,arr,norm){var vals=[];arr.forEach(function(v){v=norm?norm(v):v;if(v&&vals.indexOf(v)<0)vals.push(v)});$(id).innerHTML='<option value="all">全部</option>'+vals.map(function(v){return '<option value="'+v+'">'+v+'</option>'}).join('')}
function changes(){var n=listings.filter(function(x){return x.new}),d=listings.filter(function(x){return st(x)==='price_drop'||st(x)==='price_up'}),g=listings.filter(function(x){return st(x)==='sold_pending'||st(x)==='gone_pending'});$('#changeNewCount').textContent=n.length;$('#changeDropCount').textContent=d.length;$('#changeGoneCount').textContent=g.length;$('#newChanges').innerHTML=n.map(function(x){return '<div class="change-item"><strong>🆕 '+x.community+'｜'+(x.block||'')+' '+(x.floor||'')+'F</strong><small>'+money(x.price)+'</small></div>'}).join('')||'<div class="muted">目前沒有新增。</div>';$('#dropChanges').innerHTML=d.map(function(x){return '<div class="change-item"><strong>🔻 '+x.community+'｜'+(x.block||'')+' '+(x.floor||'')+'F</strong><small>'+money(x.price)+'</small></div>'}).join('')||'<div class="muted">目前沒有價格變動。</div>';$('#goneChanges').innerHTML=g.map(function(x){return '<div class="change-item"><strong>⚠️ '+x.community+'｜'+(x.block||'')+' '+(x.floor||'')+'F</strong><small>'+money(x.price)+'</small></div>'}).join('')||'<div class="muted">目前沒有狀態變更。</div>'}
function develop(){var e=listings.filter(function(x){return x.yq===false&&st(x)==='active'}),f=$('#developFilter').value;if(f==='owner')e=e.filter(function(x){return x.owner});if(f==='competitor')e=e.filter(function(x){return !x.owner});$('#developTotal').textContent=listings.filter(function(x){return x.yq===false&&st(x)==='active'}).length;$('#ownerCount').textContent=listings.filter(function(x){return x.yq===false&&st(x)==='active'&&x.owner}).length;$('#noYQCount').textContent=listings.filter(function(x){return x.yq===false&&st(x)==='active'}).length;$('#developGrid').innerHTML=sorted(e).map(card).join('')||'<div class="muted">目前沒有已確認永慶未刊登案件。</div>'}
async function json(u,d){try{var r=await fetch(u+'?v='+Date.now());return r.ok?await r.json():d}catch(e){return d}}
async function init(){var a=await json('data/listings.json',[]),m=await json('data/manual-updates.json',[]),o=await json('data/verified-overrides.json',{}),meta=await json('data/source-status.json',{});var map=new Map(a.map(function(x){return [x.id,x]}));m.forEach(function(x){map.set(x.id,Object.assign({},map.get(x.id)||{},x))});Object.keys(o).forEach(function(g){Object.keys(o[g]||{}).forEach(function(id){var x=o[g][id],old=map.get(id);if(old)map.set(id,Object.assign({},old,x,{sources:Object.assign({},old.sources||{},x.sources||{}),links:Object.assign({},old.links||{},x.links||{})}));else if(x.community)map.set(id,Object.assign({id:id},x))})});listings=dedupe(Array.from(map.values()));meta=meta||{};$('#lastUpdated').textContent='最後更新：'+(meta.lastUpdated||meta.lastVerified||'2026-09-03');fill('#buildingFilter',listings.map(function(x){return community(x.community)}));fill('#blockFilter',listings.map(function(x){return x.block}));render();changes();develop()}
['#keyword','#buildingFilter','#blockFilter','#statusFilter','#priceFilter','#areaFilter','#layoutFilter','#parkingFilter','#sortFilter'].forEach(function(s){$(s).addEventListener('input',render)});$('#resetFilters').onclick=function(){$('#keyword').value='';['#buildingFilter','#blockFilter','#statusFilter','#priceFilter','#areaFilter','#layoutFilter','#parkingFilter','#sortFilter'].forEach(function(s){$(s).value='all'});render()};$('#developFilter').onchange=develop;$('#dialogClose').onclick=function(){$('#detailDialog').close()};all('.tab').forEach(function(t){t.onclick=function(){all('.tab').forEach(function(x){x.classList.remove('active')});t.classList.add('active');all('.view').forEach(function(x){x.classList.remove('active')});$('#view-'+t.dataset.view).classList.add('active');if(t.dataset.view==='changes')changes();if(t.dataset.view==='develop')develop()}});init();
})();
</script>
<div id="communityCatalog" class="card" style="margin:18px 0"><div style="font-weight:800;margin-bottom:10px">監控大樓總覽</div><div style="display:flex;flex-wrap:wrap;gap:8px"><button type="button" data-community="板橋新巨蛋">板橋新巨蛋</button><button type="button" data-community="板橋文化勳章">板橋文化勳章</button><button type="button" data-community="板橋公園世紀">板橋公園世紀</button><button type="button" data-community="板橋欣璞綻">板橋欣璞綻</button><button type="button" data-community="板橋綠如意">板橋綠如意</button><button type="button" data-community="板橋榮耀交響曲">板橋榮耀交響曲</button><button type="button" data-community="板橋千禧園">板橋千禧園</button><button type="button" data-community="板橋佳元植">板橋佳元植</button><button type="button" data-community="板橋文化興">板橋文化興</button><button type="button" data-community="板橋吉祥花園廣場">板橋吉祥花園廣場</button></div><div id="communityCatalogHint" style="margin-top:10px;font-size:13px;opacity:.72">點選大樓即可快速篩選；若目前沒有可確認在售案件，仍會保留在總覽。</div></div>
<script>
(function(){
  var box=document.getElementById('communityCatalog');
  if(!box)return;
  function bind(){
    document.querySelectorAll('#communityCatalog button[data-community]').forEach(function(b){
      if(b.dataset.bound)return; b.dataset.bound='1';
      b.addEventListener('click',function(){
        var sel=document.getElementById('buildingFilter');
        if(sel){ sel.value=b.dataset.community; sel.dispatchEvent(new Event('change',{bubbles:true})); }
        window.scrollTo({top:0,behavior:'smooth'});
      });
    });
  }
  bind();
})();
</script>
